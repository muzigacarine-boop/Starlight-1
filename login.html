<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | Starlight Connect</title>
  <link rel="stylesheet" href="styles/style.css">
  <link rel="stylesheet" href="styles/login.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="login.html" aria-label="Starlight Connect">
      <span class="brand-mark">S</span>
      <span class="brand-name">starlight<span>check-in</span></span>
    </a>
    <a class="auth-top-link" href="signup.html">Create account</a>
  </header>

  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="loginTitle">
      <p class="eyebrow">WELCOME BACK</p>
      <h1 id="loginTitle">Log in to your journey</h1>
      <p class="auth-description">
        Sign in to complete your monthly check-in and see your progress.
      </p>

      <form id="login-form" class="auth-form">
        <div class="auth-field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" required>
        </div>

        <div class="auth-field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>

        <button class="primary-button" type="submit">Log in</button>
      </form>

      <p class="auth-switch">New here? <a href="signup.html">Create an account</a></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="scripts/auth.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      logIn(
        document.getElementById('email').value,
        document.getElementById('password').value
      );
    });
  </script>
</body>
</html>
