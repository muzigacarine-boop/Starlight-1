<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly check-in | Starlight Connect</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="Starlight Connect home">
        <span class="brand-mark">S</span>
        <span class="brand-name">starlight<span>check-in</span></span>
      </a>
      <a class="text-link" href="index.html">← Back to dashboard</a>
    </header>

    <main class="dashboard">
      <section class="welcome-section">
        <p class="eyebrow">MONTHLY CHECK-IN</p>
        <h1>Tell us how you're doing</h1>
        <p class="welcome-description">
          It takes about a minute. Your answers help Starlight stay connected and support you.
        </p>
      </section>

      <section class="checkin-form-card">
        <form id="checkin-form">

          <div class="form-group">
            <label for="status">What are you doing right now?</label>
            <select id="status" name="status" required>
              <option value="">Select…</option>
              <option value="studying">Studying (university or college)</option>
              <option value="working">Working</option>
              <option value="internship">Internship or apprenticeship</option>
              <option value="own_project">Running my own project or business</option>
              <option value="seeking">Looking for opportunities</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label for="organisation">Where do you study or work?</label>
            <input type="text" id="organisation" name="organisation" autocomplete="organization">
            <p class="field-hint">School, university, company or project. Leave blank if it doesn't apply.</p>
          </div>

          <div class="form-group">
            <label for="location">Which city and country are you in now?</label>
            <input type="text" id="location" name="location" required>
          </div>

          <div class="form-group">
            <label for="support_needed">What support would help you most?</label>
            <select id="support_needed" name="support_needed">
              <option value="">Select…</option>
              <option value="none">None right now</option>
              <option value="mentorship">Mentorship</option>
              <option value="internships">Internships or jobs</option>
              <option value="scholarships">Scholarships or school fees</option>
              <option value="skills">Skills training</option>
              <option value="other">Something else</option>
            </select>
          </div>

          <div class="form-group">
            <label for="highlights">What went well this month?</label>
            <textarea id="highlights" name="highlights" rows="3"></textarea>
          </div>

          <div class="form-group">
            <label for="challenges">Any challenges you'd like us to know about?</label>
            <textarea id="challenges" name="challenges" rows="3"></textarea>
          </div>

          <label class="consent-option">
            <input type="checkbox" id="confirmed" name="confirmed" required>
            <span>I confirm that my answers are accurate.</span>
          </label>

          <button class="primary-button" type="submit">Submit check-in</button>
          <p id="formMessage" class="form-message" role="status"></p>
        </form>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="scripts/auth.js"></script>
  <script src="scripts/checkin.js"></script>
</body>
</html>
